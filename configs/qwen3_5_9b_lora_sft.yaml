### model
model_name_or_path: Qwen/Qwen3.5-9B
template: qwen3_5_nothink
trust_remote_code: true

### method
stage: sft
do_train: true
finetuning_type: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
lora_target: all

### dataset
dataset: character
dataset_dir: data
cutoff_len: 2048
overwrite_cache: false
preprocessing_num_workers: 4

### output
output_dir: saves/qwen3.5-9b/character-lora
logging_steps: 10
save_steps: 200
save_total_limit: 3
plot_loss: true
overwrite_output_dir: false

### train
per_device_train_batch_size: 8
gradient_accumulation_steps: 2
learning_rate: 1.0e-4
num_train_epochs: 2.0
lr_scheduler_type: cosine
warmup_steps: 100
optim: adamw_torch
bf16: true
ddp_timeout: 180000000

### logging
report_to: none
